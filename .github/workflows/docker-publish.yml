name: Build and push to Docker Hub

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      image_name:
        description: "Docker Hub repo (namespace/name). Default: <DOCKERHUB_USERNAME>/openvpn-ui"
        required: false
        default: ""

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve image name
        id: meta
        run: |
          IMAGE="${{ github.event.inputs.image_name }}"
          if [ -z "$IMAGE" ]; then IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/openvpn-ui"; fi
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      # ubuntu-latest is amd64 + has buildx, so build.sh auto-selects the amd64
      # base images and produces local/openvpn-ui:latest. No cn mirrors needed.
      - name: Build image via build.sh
        working-directory: build
        run: bash build.sh

      - name: Tag and push :latest
        run: |
          docker tag local/openvpn-ui:latest "${{ steps.meta.outputs.image }}:latest"
          docker push "${{ steps.meta.outputs.image }}:latest"
